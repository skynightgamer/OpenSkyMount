[project]
name = "openskymount"
version = "0.1.0"
description = "Local-first control software and simulator for a modular motorized alt-az astronomy mount"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "skyfield>=1.48",
    "skyfield-data>=6.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
    # Independent ASCOM Alpaca client used by the Alpaca end-to-end test (skipped if missing).
    "alpyca>=3.0",
]
# Independent cross-check of astronomy results (tests skip if missing).
crosscheck = ["astropy>=6"]
# Experimental plate-solving proof of concept.
solve = ["cedar-solve>=0.5"]

[project.scripts]
openskymount = "openskymount.server.__main__:main"
openskymount-fake-firmware = "openskymount.mount.fake_firmware:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["openskymount*"]

[tool.setuptools.package-data]
openskymount = ["data/*.json", "data/LICENSE*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::RuntimeWarning:skyfield_data.*", "ignore::DeprecationWarning:fastapi.*", "ignore::DeprecationWarning:skyfield.*"]
addopts = "-p no:asyncio"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
