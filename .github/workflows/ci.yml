name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python ${{ matrix.python }}${{ matrix.extras && ', optional extras' || '' }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.11"   # oldest supported (requires-python >= 3.11)
            extras: false
          - python: "3.13"   # also runs the Astropy cross-checks and the plate-solving tests
            extras: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/pip install --upgrade pip
          backend/.venv/bin/pip install -e "backend[dev]"
      - name: Install optional extras (astropy, cedar-solve)
        if: matrix.extras
        run: |
          backend/.venv/bin/pip install astropy scipy pillow
          backend/.venv/bin/pip install --no-deps cedar-solve
      - name: Lint (ruff)
        run: backend/.venv/bin/ruff check backend/openskymount backend/tests
      - name: Types (mypy)
        working-directory: backend
        run: .venv/bin/mypy openskymount
      - name: Tests (pytest)
        working-directory: backend
        run: .venv/bin/python -m pytest -q -rs

  frontend:
    name: Frontend (types, unit tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc -p tsconfig.json
      - run: npx vitest run
      - run: npm run build

  e2e:
    name: Browser E2E (Playwright, Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/pip install -e "backend[dev]"
      - name: Install frontend and Playwright
        working-directory: frontend
        run: |
          npm ci
          # Same version as the development container; not a package.json dependency so local setups can use a
          # pre-installed Playwright.
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: E2E
        env:
          SHOTS: ${{ runner.temp }}/e2e-shots
          LOG_DIR: ${{ runner.temp }}/e2e-logs
        run: scripts/e2e.sh
      - name: Upload screenshots and server logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: e2e-screenshots-and-logs
          path: |
            ${{ runner.temp }}/e2e-shots
            ${{ runner.temp }}/e2e-logs
          if-no-files-found: ignore
          retention-days: 14
